name: JMIT Automatic Content Sync

on:

  workflow_dispatch:

  schedule:
    - cron: "17 */3 * * *"


concurrency:

  group: jmit-content-sync

  cancel-in-progress: false


jobs:

  sync:

    name: Sync JMIT Content

    runs-on: ubuntu-latest

    timeout-minutes: 40


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Run JMIT Deep Sync
        env:

          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

          JMIT_IMPORT_ADMIN_EMAIL: ${{ secrets.JMIT_SYNC_EMAIL }}

          JMIT_IMPORT_ADMIN_PASSWORD: ${{ secrets.JMIT_SYNC_PASSWORD }}

        run: node scripts/import-jmit.mjs
